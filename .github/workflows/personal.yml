name: Personal release

on:
  push:
    branches: [personal]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-release
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'colthreepv/openchamber' && github.ref == 'refs/heads/personal'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version="$(node -p "require('./package.json').version")-personal.${BUILD_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=personal/v$version" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: bun install --frozen-lockfile
      - name: Set personal version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm pkg set version="$VERSION" --workspace @openchamber/web --workspace @openchamber/ui --include-workspace-root
      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.PERSONAL_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/personal.p12"
      - name: Build personal APK
        env:
          OPENCHAMBER_ANDROID_PERSONAL: 'true'
          OPENCHAMBER_ANDROID_VERSION_CODE: ${{ needs.version.outputs.build }}
          OPENCHAMBER_ANDROID_VERSION_NAME: ${{ needs.version.outputs.version }}
          OPENCHAMBER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/personal.p12
          OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.PERSONAL_ANDROID_KEYSTORE_PASSWORD }}
          OPENCHAMBER_ANDROID_KEY_PASSWORD: ${{ secrets.PERSONAL_ANDROID_KEY_PASSWORD }}
          OPENCHAMBER_ANDROID_KEY_ALIAS: ${{ secrets.PERSONAL_ANDROID_KEY_ALIAS }}
        run: |
          bun run build:web
          bun run --cwd packages/mobile build:assets
          (cd packages/mobile && bunx cap sync android)
          bash packages/mobile/android/gradlew -p packages/mobile/android assembleRelease
      - name: Stage APK
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p artifacts
          cp packages/mobile/android/app/build/outputs/apk/release/app-release.apk "artifacts/OpenChamber-${VERSION}-android.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$apksigner" verify --verbose artifacts/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: personal-android
          path: artifacts/*
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/personal.p12"

  test:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: node scripts/run-isolated-tests.mjs packages/ui/src/lib/assistants
      - run: bun run --cwd packages/web test server/lib/openchamber-sessions/routes.test.js server/lib/assistants/prompt-plugin.test.js server/lib/opencode/managed-config-file.test.js server/lib/opencode/core-routes.test.js server/lib/opencode/settings-helpers.test.js server/lib/dictation/opencodex-session.test.js server/lib/dictation/stream-manager.test.js

  web:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Set personal version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: npm pkg set version="$VERSION" --workspace @openchamber/web --workspace @openchamber/ui --include-workspace-root
      - run: bun run build:web
      - name: Pack server and SDK
        run: |
          mkdir -p artifacts
          bun pm pack --cwd packages/sdk --destination ../../artifacts
          bun pm pack --cwd packages/web --destination ../../artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: personal-web-packages
          path: artifacts/*.tgz
          if-no-files-found: error

  server:
    needs: [version, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: personal-web-packages
          path: packages-to-install
      - name: Assemble server
        run: |
          mkdir server
          cd server
          npm init -y
          npm install --omit=dev --no-audit --no-fund ../packages-to-install/*.tgz
      - name: Add launcher and instructions
        run: |
          node scripts/personal-server-launchers.mjs server
          cp personal.md server/personal.md
      - name: Install smoke-test OpenCode
        run: |
          version="$(node -p "require('./packages/electron/package.json').opencodeCli.version")"
          npm install -g "@opencode/cli@$version"
      - name: Smoke-test packaged server
        env:
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/personal-server-smoke.mjs server
      - name: Archive server
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p artifacts
          if [[ "$PLATFORM" == windows-* ]]; then
            7z a "artifacts/OpenChamber-${VERSION}-server-${PLATFORM}.zip" ./server/*
          else
            tar -czf "artifacts/OpenChamber-${VERSION}-server-${PLATFORM}.tar.gz" -C server .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: personal-server-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: [version, test, server, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          pattern: personal-server-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: personal-android
          path: artifacts
      - name: Write release manifest and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('artifacts/manifest.json', JSON.stringify({
            version: process.env.VERSION,
            commit: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            run: process.env.GITHUB_RUN_ID,
            androidApplicationId: 'com.openchamber.app.personal',
          }, null, 2) + '\n');
          NODE
          (cd artifacts && sha256sum ./* > SHA256SUMS)
      - name: Publish personal release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" artifacts/* --target "$GITHUB_SHA" \
            --title "OpenChamber $VERSION" --prerelease \
            --notes "Personal build of the assistants featureset. See personal.md for composition and installation. Windows and Linux servers require Node.js 24.14+ and OpenCode on PATH. Android background push is unavailable in this build."
